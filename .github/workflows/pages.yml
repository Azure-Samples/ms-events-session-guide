name: Build and deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.159.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install pinned dependencies
        run: npm ci

      - name: Preserve published event identities
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENTS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-event-identities.mjs

      - name: Install pinned Hugo
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output hugo_checksums.txt \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing hugo_checksums.txt
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Run code-level unit and regression tests
        run: npm test

      - name: Install Chromium for critical browser journeys
        run: npx playwright install --with-deps chromium

      - name: Run critical browser smoke tests
        id: smoke
        run: npm run test:e2e:smoke

      - name: Retain smoke reports and browser evidence
        if: always() && steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-smoke-${{ github.run_id }}
          path: test-results/e2e-smoke*
          retention-days: 7
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build telemetry-free preview
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        env:
          HUGO_ENVIRONMENT: production
          HUGO_TELEMETRY_ENABLED: "false"
          SITE_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: hugo --gc --minify --cleanDestinationDir --baseURL "${SITE_BASE_URL}/"

      - name: Build Hugo with the deployment base URL
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HUGO_ENVIRONMENT: production
          HUGO_TELEMETRY_ENABLED: ${{ vars.HUGO_TELEMETRY_ENABLED || 'true' }}
          HUGO_TELEMETRY_ENV: production
          HUGO_TELEMETRY_CONNECTION_STRING: ${{ vars.HUGO_TELEMETRY_CONNECTION_STRING }}
          HUGO_TELEMETRY_ORIGIN: ${{ vars.HUGO_TELEMETRY_ORIGIN }}
          HUGO_TELEMETRY_BUILD_ID: ${{ github.sha }}
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: hugo --gc --minify --cleanDestinationDir --baseURL "${SITE_BASE_URL}/"

      # Package directly to avoid upload-pages-artifact's mutable nested action ref.
      - name: Package static site
        shell: bash
        run: |
          tar \
            --dereference --hard-dereference \
            --directory public \
            --exclude=.git \
            --exclude=.github \
            -cf "$RUNNER_TEMP/artifact.tar" \
            .

      - name: Upload static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
